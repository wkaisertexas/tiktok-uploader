[project]
name = "tiktok-uploader"
version = "1.2.0"
authors = [
  { name = "William Kaiser", email = "wkaisertexas@gmail.com" },
]
description = "An automatic TikTok video uploader w/ CLI. Uploads videos automatically using an automated browser and your cookies for authentication."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
	"Selenium",
	"Automation",
	"TikTok",
  "Video",
  "Python",
  "Upload",
  "CLI",
  "Command Line",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
	"playwright>=1.64.1",
	"pydantic>=2.14.2",
	"pytz>=2026.6",
	"toml>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=2.4.1",
    # 3.x needs Python 3.11; only examples/series_upload.py imports pandas
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pytz>=2026.6.0.20261031",
    "types-toml>=0.10.8.20260518",
]

[project.scripts]
tiktok-uploader = "tiktok_uploader.cli:main"
tiktok-uploader-batch = "tiktok_uploader.cli:batch_upload"
tiktok-auth = "tiktok_uploader.cli:auth"

[project.urls]
"Source Code" = "https://github.com/wkaisertexas/tiktok-uploader"
"Bug Tracker" = "https://github.com/wkaisertexas/tiktok-uploader/issues"
